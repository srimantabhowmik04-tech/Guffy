name: Build Guffy Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Recreate Android Project Files
      run: flutter create . --project-name=guffy --platforms=android --org=com.guffy.app

    - name: Add Required Dependencies
      run: |
        flutter pub add firebase_core:^2.27.0
        flutter pub add firebase_auth:^4.17.8
        flutter pub add cloud_firestore:^4.15.8
        flutter pub add google_mobile_ads:^5.0.0

    - name: Configure Android Manifest for AdMob & MinSdkVersion
      run: |
        # Set minSdkVersion to 21 in build.gradle
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
        
        # Add AdMob App ID inside AndroidManifest.xml
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: guffy-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
