name: Build Guffy Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Auto Generate Project & Build APK
      run: |
        # 1. Take backup of main.dart
        mkdir -p /tmp/backup
        cp lib/main.dart /tmp/backup/main.dart

        # 2. Create standard flutter application
        flutter create --project-name=guffy --org=com.guffy.app clean_app
        cp -r clean_app/* .
        cp clean_app/.metadata . 2>/dev/null || true

        # 3. Restore main.dart
        cp /tmp/backup/main.dart lib/main.dart

        # 4. Build final Release APK
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: guffy-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
